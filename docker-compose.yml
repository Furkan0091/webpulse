services:
  postgres:
    image: postgres:16-alpine
    container_name: webpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: webpulse
      POSTGRES_PASSWORD: webpulse
      POSTGRES_DB: webpulse
    ports:
      - "5432:5432"
    volumes:
      - webpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webpulse -d webpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: webpulse-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - webpulse_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  webpulse_pgdata:
  webpulse_redisdata:
